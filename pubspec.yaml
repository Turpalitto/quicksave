name: quicksave
description: QuickSave — save public Instagram Reels, posts and stories via Share Intent. Gallery, batch download, download-later queue.
publish_to: "none"
version: 1.5.4+22

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^3.4.2
  riverpod: ^3.4.2

  # HTTP
  dio: ^5.11.0

  # Local storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # System integration
  open_filex: ^4.3.4
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.0
  permission_handler: ^13.0.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.6.0
  package_info_plus: ^10.2.1
  cached_network_image: ^3.4.1
  video_player: ^2.14.0
  archive: ^4.2.0
  path: ^1.9.0
  crypto: ^3.0.3
  workmanager: ^0.10.9
  in_app_purchase: ^3.2.0
  url_launcher: ^6.3.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true


