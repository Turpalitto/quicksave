# Dependabot configuration — groups dependency PRs to avoid noise.
# Flutter / Dart, backend (npm) and the Chrome extension are tracked separately.
version: 2
updates:
  # Flutter (pubspec.yaml + package.json for tooling)
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      flutter-core:
        patterns:
          - 'flutter_riverpod'
          - 'riverpod'
          - 'dio'
          - 'share_plus'
          - 'flutter_local_notifications'
          - 'path_provider'
          - 'package_info_plus'
          - 'video_player'
          - 'connectivity_plus'
          - 'permission_handler'
          - 'uuid'
          - 'archive'
          - 'workmanager'
          - 'move_*'

  # Backend (Express / Node)
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    groups:
      backend-minor:
        patterns:
          - 'express'
          - 'helmet'
          - 'express-rate-limit'
          - 'axios'
          - 'redis'
          - 'rate-limit-redis'

  # Chrome extension (small, manual)
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: monthly
    open-pull-requests-limit: 4

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    groups:
      ci:
        patterns:
          - 'actions/*'
          - 'subosito/*'
          - 'softprops/*'

  # Gradle dependencies (Android toolchain)
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
